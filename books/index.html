 ].map(([kind,title,author,d,c,k,pos,his,done,star],i)=>({id:i+1,kind,title,author,t:n-d*D,chs:demoCh(c,k),pos,his,done,star,notes:i===0?[{ch:1,p:2,who:'him',x:'（演示）他在这一段旁边写的一句。',t:n-36e5}]:[],marks:[],newCh:i===5?1:0}));set(KEY,a)}return a}

const total=b=>b.chs.reduce((a,c)=>a+c.ps.length,0),before=(b,c,p)=>b.chs.slice(0,c).reduce((a,x)=>a+x.ps.length,0)+p;

const PR=[[99, 62], [67, 92], [99, 96], [85, 60], [110, 66], [50, 98]];
function prop(r,ri,W){if(!PR.length)return '';const used=r.reduce((a,b)=>a+(SP[b.id%SP.length]||[40])[0]+2,0);let left=W-used-16,o='',k=ri*2;for(let n=0;n<2;n++){const p=PR[(k+n)%PR.length];if(left<p[0]+14)break;o+=`<img class="prop" src="img/pr${(k+n)%PR.length}.webp" style="--ph:${p[1]}px" alt="">`;left-=p[0]+16;if(r.length)break}return o}
function desk(){const D=$('#desk'),b=[...L].filter(x=>x.pos&&!x.done).sort((x,y)=>(y.readT||0)-(x.readT||0))[0];D.style.display=pick?'none':'';

function draw(){const Bd=$('#body'),nn=L.filter(b=>b.kind==='his'&&b.newCh).length;try{parent.bookBadge&&parent.bookBadge(nn)}catch(e){}
  bar();desk();const F=[['all','全部'],['ing','在读'],['new','没开始'],['done','读完的'],['star','收藏的']];

  const W=Math.min(480,innerWidth)-12-24-8,S=[['both','一起读的',0],['his','他写给你的',1]];let i=0,ri=0,tot=0;
  const secs=S.map(([k,n,li])=>{const all=L.filter(b=>b.kind===k),a=all.filter(ok).sort((x,y)=>(x.done?1:0)-(y.done?1:0)||y.t-x.t);let rows=[[]],w=0;a.forEach(b=>{const sw=(SP[b.id%SP.length]||[40])[0];if(w+sw+2>W&&rows[rows.length-1].length){rows.push([]);w=0}rows[rows.length-1].push(b);w+=sw+2});tot+=rows.length;return {k,n,li,all,a,rows}});

    ${seek&&!pick?`<div class="seek"><input id="q" placeholder="搜书名、作者" value="${esc(q)}"><div class="chips">${F.map(([k,n])=>`<button data-f="${k}" class="${flt===k?'on':''}">${n}</button>`).join('')}</div></div>`:''}
    ${secs.map(s=>s.rows.map((r,si)=>{const o=`<div class="shelf${pick?' picking':''}">${r.map(b=>{const k=b.id%SP.length,sp=SP[k]||[40,130,0];return `<button class="sp${sp[2]?' lt':''}${b.id===out?' out':''}${sel.has(b.id)?' sel':''}${hit(b)?'':' dim'}" data-id="${b.id}" style="--i:${i++};--h:${sp[1]}px;--ar:${(sp[0]/sp[1]).toFixed(3)};--img:url(img/sp${k}.webp);--tc:${sp[2]?'#3a2a1a':'#f3dfa6'};--pg:${pct(b)/100}" aria-label="${esc(b.title)}"><b>${esc(b.title.replace('（演示）',''))}</b>${b.pos&&!b.done?'<i class="rib"></i>':''}${b.newCh?'<i class="flag"></i>':''}${b.star?'<i class="st">★</i>':''}</button>`}).join('')}${si===0&&!s.a.length?`<span class="none">${s.all.length?'这一类没有':'这层还空着'}</span>`:''}${prop(r,ri,W)}${si===0?`<span class="lab" style="--li:url(img/lab${s.li}.webp)">${s.n}<em>${s.a.length}</em></span>`:''}</div>`;ri++;return o}).join('')).join('')}`;
  Bd.querySelectorAll('.sp').forEach(e=>e.onclick=()=>{const id=+e.dataset.id;if(pick){sel.has(id)?sel.delete(id):sel.add(id);e.classList.toggle('sel');bar();return}if(out===id){openBook(id);return}out=id;Bd.querySelectorAll('.sp').forEach(x=>x.classList.toggle('out',+x.dataset.id===id));peek()});
  const qi=$('#q');if(qi)qi.oninput=()=>{q=qi.value.trim();const p=qi.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const sk=$('#sk');if(sk)sk.onclick=()=>{seek=!seek;if(!seek){q='';flt='all'}draw();if(seek)$('#q').focus()};
  $('#pk').onclick=()=>{pick=!pick;sel.clear();out=null;peek();draw()};const ad=$('#add');if(ad)ad.onclick=addBook;Bd.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;out=null;peek();draw()})}
function peek(){const P=$('#peek'),b=L.find(x=>x.id===out);P.classList.toggle('on',!!b&&!pick);if(!b)return;const hp=b.his?Math.round(before(b,b.his.ch,b.his.p+1)/total(b)*100):null;
  P.innerHTML=`<button class="x" id="pX" aria-label="放回去">×</button><div class="cov"><b>${esc(b.title.replace('（演示）',''))}</b></div><div class="pk"><h3>${esc(b.title)}</h3><p>${esc(b.author||'')}${b.author?' · ':''}${b.chs.length} 章 · ${state(b)}${hp!=null&&b.kind==='both'?' · 他读到 '+hp+'%':''}${b.newCh?' · 他新写了一章':''}</p><div class="pr" style="--w:${pct(b)}%"></div>
    <div class="bs"><button class="go" id="pGo">${b.pos&&!b.done?'接着读':b.done?'再读一遍':'开始读'}</button><button id="pStar" class="${b.star?'on':''}">${b.star?'★ 收藏了':'收藏'}</button><button id="pDone">${b.done?'标成没读完':'标成读完'}</button><button id="pDel">拿走</button></div></div>`;
  $('#pX').onclick=()=>{out=null;peek();document.querySelectorAll('.sp.out').forEach(x=>x.classList.remove('out'))};$('#pGo').onclick=()=>openBook(b.id,b.done);
  $('#pStar').onclick=()=>{b.star=b.star?0:1;set(KEY,L);draw();peek()};$('#pDone').onclick=()=>{b.done=b.done?0:1;set(KEY,L);draw();peek()};
  $('#pDel').onclick=e=>{const d=e.currentTarget;if(!d.dataset.s){d.dataset.s=1;d.textContent='确定拿走？';d.classList.add('on');return}const el=document.querySelector('.sp.out');if(el)el.classList.add('gone');out=null;peek();setTimeout(()=>{L=L.filter(x=>x!==b);set(KEY,L);draw()},350)}}
function bar(){const M=$('#mbar');M.classList.toggle('on',pick);if(!pick)return;const n=sel.size;

const shut=()=>$('#veil').classList.remove('on');$('#veil').addEventListener('click',e=>{if(e.target.id==='veil')shut()});

  $('#cacts').innerHTML='<button id="cNo">算了</button><button class="go" id="cYes">放上书架</button>';$('#veil').classList.add('on');setTimeout(()=>$('#fT').focus(),60);document.querySelectorAll('.kd button').forEach(b=>b.onclick=()=>{addK=b.dataset.k;document.querySelectorAll('.kd button').forEach(x=>x.classList.toggle('on',x===b))});$('#cNo').onclick=shut;

const R=$('#rd'),PG=$('#rpg');
function applyPrefs(){R.dataset.th=prefs.th;PG.style.setProperty('--fs',prefs.fs+'px');PG.style.setProperty('--lh',prefs.lh);$('#rDown').style.display=prefs.tap?'':'none';set('books-prefs',prefs)}
function openBook(id,restart){B=L.find(x=>x.id===id);if(!B)return;if(restart){B.pos=null;B.done=0}if(B.newCh){B.newCh=0}ch=B.pos?B.pos.ch:0;set(KEY,L);$('#peek').classList.remove('on');$('#rTitle').textContent=B.title;applyPrefs();page(B.pos?B.pos.p:0);R.classList.add('on')}
function page(toP){const c=B.chs[ch],hisHere=B.his&&B.his.ch===ch&&B.kind==='both';pickP=null;
  PG.innerHTML=`<h2>${esc(c.t)}</h2>`+c.ps.map((x,i)=>`<p data-i="${i}" class="${B.marks.some(m=>m.ch===ch&&m.p===i)?'mk':''}">${esc(x)}</p>${B.notes.filter(n=>n.ch===ch&&n.p===i).map(n=>`<div class="nt${n.who==='him'?' him':''}">${esc(n.x)}<small>${n.who==='him'?'他':'你'} · ${fd(n.t)}</small></div>`).join('')}${hisHere&&B.his.p===i?'<div class="his">他读到这里</div>':''}`).join('')+
    `<div class="rend">${ch<B.chs.length-1?'<button id="eNext">下一章</button>':B.done?'<span style="color:var(--rs);font-size:13px">这本读完了</span>':'<button id="eDone">读完了</button>'}</div>`;
  PG.scrollTop=0;if(toP){const e=PG.querySelector(`p[data-i="${toP}"]`);if(e)PG.scrollTop=e.offsetTop-PG.offsetTop-12}
  PG.querySelectorAll('p').forEach(p=>p.onclick=()=>pickPara(+p.dataset.i));const en=$('#eNext');if(en)en.onclick=()=>go(1);const ed=$('#eDone');if(ed)ed.onclick=()=>{B.done=1;B.doneT=Date.now();set(KEY,L);toast('读完了');closeBook()};
  $('#rPrev').disabled=ch===0;$('#rNext').disabled=ch>=B.chs.length-1;track()}
function go(d){ch=Math.max(0,Math.min(B.chs.length-1,ch+d));page(0)}
function track(){if(!B)return;const top=PG.scrollTop+PG.offsetTop+20;let p=0;PG.querySelectorAll('p').forEach(e=>{if(e.offsetTop<=top)p=+e.dataset.i});if(!B.done)B.pos={ch,p};B.readT=Date.now();set(KEY,L);$('#rPos').textContent=`第 ${ch+1} / ${B.chs.length} 章 · ${B.done?100:pct(B)}%`;$('#rBm').classList.toggle('on',B.marks.some(m=>m.ch===ch&&m.p===p));$('#rBm').textContent=B.marks.some(m=>m.ch===ch&&m.p===p)?'★书签':'书签'}
let tt=0;PG.addEventListener('scroll',()=>{clearTimeout(tt);tt=setTimeout(track,150)});
function pickPara(i){const old=PG.querySelector('.pact');if(old)old.remove();PG.querySelectorAll('p.pick').forEach(e=>e.classList.remove('pick'));if(pickP===i){pickP=null;return}if(String(getSelection())) return;pickP=i;const p=PG.querySelector(`p[data-i="${i}"]`);p.classList.add('pick');
  const has=B.marks.some(m=>m.ch===ch&&m.p===i),a=document.createElement('div');a.className='pact';a.innerHTML=`<input maxlength="60" placeholder="在这一段旁边写一句"><button data-a="say">写上</button><button data-a="mk">${has?'取消书签':'书签'}</button>`;let after=p;while(after.nextElementSibling&&after.nextElementSibling.classList.contains('nt'))after=after.nextElementSibling;after.after(a);
  const say=()=>{const x=a.querySelector('input').value.trim();if(!x)return;B.notes.push({ch,p:i,who:'me',x,t:Date.now()});set(KEY,L);const st=PG.scrollTop;page(0);PG.scrollTop=st};
  a.querySelector('[data-a=say]').onclick=say;a.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')say()});a.querySelector('[data-a=mk]').onclick=()=>{mark(i);const st=PG.scrollTop;page(0);PG.scrollTop=st}}
function mark(i){const k=B.marks.findIndex(m=>m.ch===ch&&m.p===i);if(k>=0)B.marks.splice(k,1);else B.marks.push({ch,p:i,t:Date.now()});set(KEY,L);return k<0}
$('#rBm').onclick=()=>{const on=mark(B.pos&&B.pos.ch===ch?B.pos.p:0);const st=PG.scrollTop;page(0);PG.scrollTop=st;toast(on?'夹了一张书签':'书签拿掉了')};

const closeSheets=()=>{$('#toc').classList.remove('on');$('#set').classList.remove('on')};PG.addEventListener('pointerdown',closeSheets);
let tocTab='ch';function toc(){const T=$('#toc'),jump=(c,p)=>{ch=c;page(p);closeSheets()};
