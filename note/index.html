<!doctype html>
<html lang="zh-CN" data-room="note"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>公告板</title>
<style>
@font-face{font-family:"Letter";src:url(../post/fonts/wenkai-core.woff2) format("woff2");font-display:swap}@font-face{font-family:"LetterAll";src:url(../post/fonts/wenkai.woff2) format("woff2");font-display:swap}
:root{--bg:#f6e6c8;--paper:#fdf7e6;--ink:#3a2a1a;--soft:rgba(58,42,26,.58);--line:rgba(58,42,26,.12);--red:#a8322a}
body[data-sky=night]{--bg:#2a2733;--ink:#efe3c8;--soft:rgba(239,227,200,.6);--line:rgba(239,227,200,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit}
.hand{font-family:"Letter","LetterAll","Kaiti SC","STKaiti","KaiTi",serif}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.head{position:relative;flex:none;width:100%;aspect-ratio:3/1;background:#c9b28a url(img/board.webp) center/cover no-repeat}
body[data-sky=night] .head{filter:brightness(.6) saturate(.85)}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30%;background:linear-gradient(transparent,var(--bg))}
.back{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top)*.7);height:30px;padding:0 12px;border:0;border-radius:15px;background:rgba(255,250,238,.92);color:#3a2a1a;font-size:12.5px;font-weight:500;box-shadow:0 1px 4px rgba(40,30,10,.3);cursor:pointer;z-index:3}
.plate{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:2;background:url(../post/img/sign.webp) center/100% 100% no-repeat;padding:13px 22px 7px;font-size:17px;color:#3a2a1a;white-space:nowrap}
.tabs{flex:none;display:flex;gap:4px;padding:6px 14px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;height:36px;font-size:14px;color:var(--soft);cursor:pointer;position:relative}
.tabs button.on{color:var(--ink);font-weight:600}.tabs button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:var(--red);border-radius:2px}
.tabs em{font-style:normal;display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10.5px;margin-left:4px;vertical-align:1px;padding:0 4px}
.body{flex:1;overflow-y:auto;padding:12px 12px 100px;-webkit-overflow-scrolling:touch}
.sum{font-size:12px;color:var(--soft);margin:0 4px 10px}
.wall{display:block}
/* 一道缆绳，上面系两张货签 */
.line{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;padding:26px 6px 0;margin:0 -12px 16px;padding-left:18px;padding-right:18px}
.line::before{content:"";position:absolute;left:-6px;right:-6px;top:-1px;height:17px;background:url(img/rope.webp) left center/auto 100% repeat-x;filter:drop-shadow(0 2px 2px rgba(70,45,15,.3));transform:rotate(var(--tilt,0deg));transform-origin:50% 50%}
.line:nth-child(odd){--tilt:.5deg}.line:nth-child(even){--tilt:-.6deg}
/* 货签 */
.n{--r:0deg;--c:#f3e3bd;position:relative;display:block;width:100%;margin:0;padding:24px 12px 10px;border:0;text-align:left;background:var(--c);color:#3a2a1a;font-size:16px;line-height:1.5;transform:rotate(var(--r));transform-origin:50% -14px;box-shadow:0 1px 0 rgba(120,90,50,.3),2px 5px 9px rgba(80,55,20,.2);cursor:pointer;clip-path:none;border-radius:2px;word-break:break-word;animation:sway var(--s,4.6s) ease-in-out infinite;animation-delay:var(--d,0s);
  -webkit-mask:linear-gradient(135deg,transparent 13px,#000 13.5px) top left/51% 100% no-repeat,linear-gradient(-135deg,transparent 13px,#000 13.5px) top right/51% 100% no-repeat;mask:linear-gradient(135deg,transparent 13px,#000 13.5px) top left/51% 100% no-repeat,linear-gradient(-135deg,transparent 13px,#000 13.5px) top right/51% 100% no-repeat}
@keyframes sway{0%,100%{transform:rotate(calc(var(--r) - 1.6deg))}50%{transform:rotate(calc(var(--r) + 1.6deg))}}
.n[data-c=yellow]{--c:#f3e3bd}.n[data-c=cream]{--c:#f8f1e0}.n[data-c=blue]{--c:#c9d8de}.n[data-c=rose]{--c:#ecc4b6}.n[data-c=green]{--c:#cfdcc0}
.n::before{content:"";position:absolute;left:50%;top:7px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px #b08a4a,inset 0 1px 2px rgba(0,0,0,.35)}
.n::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#2f4a66 0 9px,transparent 9px 14px,#a8322a 14px 23px,transparent 23px 28px);opacity:.75}
.hang{position:relative;min-width:0}
.hang::before{content:"";position:absolute;left:50%;top:-20px;width:1.5px;height:32px;background:#8a6a3a;transform:rotate(var(--r,0deg));transform-origin:50% 0;z-index:2;box-shadow:3px 0 0 -0.2px rgba(138,106,58,.0)}
.hang::after{content:"";position:absolute;left:50%;top:-23px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c08c,#8a6a3a);z-index:3;box-shadow:0 1px 1px rgba(60,40,10,.4)}
.flag{position:absolute;right:8px;top:-22px;width:0;height:0;border-left:16px solid #b3261e;border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:3;transform-origin:0 50%;animation:flap 1.1s ease-in-out infinite;filter:drop-shadow(0 1px 1px rgba(60,20,10,.35))}
.flag::before{content:"";position:absolute;left:-18px;top:-9px;width:2px;height:22px;background:#6b4a22}
@keyframes flap{50%{transform:skewY(9deg) scaleX(.9)}}
.n p{margin:0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.n .ft{display:flex;justify-content:space-between;align-items:center;margin:8px 0 5px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:rgba(58,42,26,0.88)}
.n .ft b{font-weight:500}.n .ft u{text-decoration:none}
.hang.fall{animation:blow 1s cubic-bezier(.4,0,.8,.5) forwards;z-index:9}
@keyframes blow{20%{transform:translate(0,6px) rotate(-8deg)}100%{transform:translate(130vw,-30vh) rotate(70deg) scale(.7);opacity:.2}}
.hang.drop{animation:tie .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tie{from{transform:translateY(-34px) rotate(-10deg);opacity:0}}
.empty{text-align:center;color:var(--soft);font-size:15px;padding:40px 0;line-height:1.8}
/* 底下：便签本 */
.desk{position:absolute;left:0;right:0;bottom:0;z-index:5;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(#d9a55f,#c68f4c);border:0;border-top:3px solid #a8743a;box-shadow:0 -3px 10px rgba(80,50,15,.22);display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
body[data-sky=night] .desk{filter:brightness(.7)}
.desk img{position:absolute;right:24px;bottom:calc(8px + env(safe-area-inset-bottom));height:86px;transform:rotate(8deg);transition:transform .25s;pointer-events:none}
.desk:active img{transform:rotate(2deg) translateY(-4px)}
.desk span{font-family:"Letter","LetterAll","Kaiti SC",serif;font-size:18px;background:#f3e3bd;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%,0 9px);color:#3a2a1a;padding:7px 22px 6px;box-shadow:0 1px 0 rgba(120,90,50,.3),0 3px 6px rgba(80,55,20,.18);transform:rotate(-1.5deg);margin-right:70px}
/* 放大看 */
.veil{position:absolute;inset:0;z-index:20;background:rgba(40,28,14,.66);opacity:0;pointer-events:none;transition:opacity .22s;display:flex;flex-direction:column;align-items:center;padding:calc(54px + env(safe-area-inset-top)) 22px 0;overflow-y:auto}
.veil.on{opacity:1;pointer-events:auto}
.veil .x{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));border:0;background:none;color:#f3e6c8;font-size:13px;cursor:pointer;padding:6px}
.big{--c:#f3e3bd;position:relative;width:100%;max-width:330px;background:var(--c);color:#3a2a1a;padding:34px 20px 18px;font-size:20px;line-height:1.6;box-shadow:3px 8px 18px rgba(0,0,0,.3);transform:rotate(-1deg) scale(.9);transition:transform .25s cubic-bezier(.3,1.3,.5,1);border-radius:2px;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%,0 20px);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.veil.on .big{transform:rotate(-1deg)}
.big[data-c=blue]{--c:#c9d8de}.big[data-c=rose]{--c:#ecc4b6}.big[data-c=green]{--c:#cfdcc0}.big[data-c=cream]{--c:#f8f1e0}
.big::before{content:"";position:absolute;left:50%;top:9px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#5a4630;box-shadow:0 0 0 2.5px #b08a4a}
.big::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#2f4a66 0 11px,transparent 11px 17px,#a8322a 17px 28px,transparent 28px 34px);opacity:.75}
.big .ft{margin-top:14px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:rgba(58,42,26,0.88);display:flex;justify-content:space-between}
.reps{width:100%;max-width:330px;margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rep{max-width:86%;background:#f8eed6;color:#3a2a1a;padding:7px 12px 6px;font-size:16px;line-height:1.45;box-shadow:1px 3px 6px rgba(0,0,0,.22);transform:rotate(.8deg)}
.rep.him{align-self:flex-start;background:#cfdde0;transform:rotate(-.8deg)}
.rep small{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:rgba(58,42,26,0.88);margin-top:2px}
.acts{width:100%;max-width:330px;margin:12px 0 30px;display:flex;gap:8px;align-items:center}
.acts input{flex:1;min-width:0;height:36px;border:0;border-radius:18px;background:var(--card);padding:0 14px;font-size:16px;color:#3a2a1a;outline:none;-webkit-user-select:text;user-select:text}
.acts button{flex:none;border:0;border-radius:18px;height:36px;padding:0 14px;font-size:13px;cursor:pointer;background:rgba(253,247,230,.16);color:#f3e6c8}
.acts .go{background:#f6e7a8;color:#3a2a1a}.acts .del{color:#f0a394}
/* 写一张 */
.wr{position:absolute;inset:0;z-index:30;background:rgba(40,28,14,.66);display:none;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top)) 22px 0}
.wr.on{display:flex}
.wr textarea{--c:#f3e3bd;width:100%;max-width:330px;height:210px;border:0;outline:none;resize:none;background:var(--c);color:#3a2a1a;padding:24px 20px 14px;font-size:20px;line-height:1.6;box-shadow:3px 8px 18px rgba(0,0,0,.3);transform:rotate(-1deg);border-radius:2px;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%,0 20px);padding-top:34px;-webkit-user-select:text;user-select:text}
.wr textarea[data-c=blue]{--c:#c9d8de}.wr textarea[data-c=rose]{--c:#ecc4b6}.wr textarea[data-c=green]{--c:#cfdcc0}.wr textarea[data-c=cream]{--c:#f8f1e0}
.wr .cnt{width:100%;max-width:330px;text-align:right;font-size:12px;color:rgba(243,230,200,0.94);margin-top:8px}
.wr .row{width:100%;max-width:330px;display:flex;align-items:center;gap:9px;margin-top:10px}
.wr .sw{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;background:var(--c)}.wr .sw.on{box-shadow:0 0 0 2px rgba(40,28,14,.9),0 0 0 4px #f3e6c8}
.wr .sp{flex:1}.wr .row button.t{border:0;background:none;color:#f3e6c8;font-size:13.5px;padding:8px 6px;cursor:pointer}
.wr .row .go{border:0;border-radius:18px;height:36px;padding:0 18px;background:#f6e7a8;color:#3a2a1a;font-size:14px;cursor:pointer}.wr .go:disabled{opacity:.4}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#3a2a1a;color:#fdf7e6;font-size:12.5px;padding:7px 14px;border-radius:16px;opacity:0;transition:.3s;pointer-events:none;z-index:60;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
/* 软木板上钉两个记号：金锚=他挂的，贝壳=你挂的；点木牌看全部 */
.head .tabs{position:absolute!important;inset:0;height:auto!important;margin:0!important;padding:0!important;display:block!important;z-index:2;pointer-events:none}
.head .tabs::before{display:none!important}
[data-room=note] .head .tabs .tp{position:absolute;pointer-events:auto;width:14%!important;max-width:none!important;height:auto!important;aspect-ratio:1;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;clip-path:none!important;background:none!important;box-shadow:none!important;filter:none!important;animation:none!important;overflow:visible;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s!important}
[data-room=note] .head .tabs .tp::before{content:""!important;display:block!important;position:absolute;left:50%;top:50%;width:150%;height:150%;margin:0;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,170,.9),rgba(255,226,150,0));opacity:0;transition:opacity .3s;box-shadow:none}
[data-room=note] .head .tabs .tp.on::before{opacity:1}
.tp img{position:relative;display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(60,35,10,.45))}
.tp u{position:absolute;left:100%;bottom:6%;margin-left:1px;text-decoration:none;font-size:12px;color:rgba(74,50,26,0.88);line-height:1}
[data-room=note] .tHim{left:19%;top:21%;transform:rotate(-8deg)!important}[data-room=note] .tMe{left:54%;top:27%;transform:rotate(7deg)!important}
[data-room=note] .tHim.on{transform:rotate(-8deg) scale(1.22)!important}[data-room=note] .tMe.on{transform:rotate(7deg) scale(1.22)!important}
[data-room=note] .head .tabs .tp.dim{opacity:.45}
[data-room=note] .head .tabs .tp em{position:absolute!important;right:4px!important;top:6px!important;min-width:15px!important;height:15px!important;line-height:15px!important;border-radius:8px!important;background:#a8322a!important;color:#fff!important;font-size:9.5px!important;font-family:-apple-system,sans-serif!important;padding:0 3px!important;margin:0!important;box-shadow:0 0 0 1.5px #f6e6c0!important}
.head .plate{bottom:2%!important;font-size:15px!important;padding:11px 18px 6px!important;border:0;cursor:pointer;z-index:3}
.hang{transform-origin:50% 0}

/* 统一角标：红底白字、18 高、12 号、一圈米白描边。全站同一个样子 */
.tp em{min-width:18px!important;height:18px!important;line-height:18px!important;border-radius:9px!important;padding:0 5px!important;background:#a8322a!important;color:#fff!important;font:600 12px/18px -apple-system,"PingFang SC","Helvetica Neue",sans-serif!important;font-style:normal!important;letter-spacing:0!important;text-align:center!important;box-shadow:0 0 0 1.5px #fbf3e2,0 1px 2px rgba(40,20,10,.35)!important;box-sizing:border-box!important}

/* 动效减法：常驻循环每屏最多三样，挂着的东西改成手碰到、滑动带到才晃（fx.js） */
.n{animation:none}
</style><link rel="stylesheet" href="../skin.css"></head>
<body><div id="app" data-tuck="no">
  <div class="head"><button class="back" id="back">‹ 回镇上</button><button class="plate hand" id="allBtn">公告板</button><div class="tabs" id="tabs"><button data-t="him" class="tp tHim hand" aria-label="他挂的"><img src="img/lg_him.webp" alt=""><u>他</u><em id="nNew"></em></button><button data-t="me" class="tp tMe hand" aria-label="你挂的"><img src="img/lg_me.webp" alt=""><u>你</u></button></div></div>
  <div class="body" id="body"></div>
  <button class="desk" id="write" aria-label="挂一张便签"><span>挂一张</span><img src="img/tags.webp" alt=""></button>

  <div class="veil" id="veil"><button class="x" id="vX">放回去</button><div class="big hand" id="big"></div><div class="reps hand" id="reps"></div>
    <div class="acts"><input id="rIn" class="hand" maxlength="40" placeholder="在下面回一句"><button class="go" id="rGo">系上</button><button class="del" id="nDel">解下来</button></div></div>

  <div class="wr" id="wr"><textarea id="wT" class="hand" maxlength="80" placeholder="随手写一句。"></textarea><div class="cnt" id="wC">0 / 80</div>
    <div class="row" id="wSw"></div><div class="row"><button class="t" id="wX">不挂了</button><span class="sp"></span><button class="go" id="wGo" disabled>系上去</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=864e5,KEY='board-notes-1',COL=[['yellow','#f3e3bd'],['cream','#f8f1e0'],['blue','#c9d8de'],['rose','#ecc4b6'],['green','#cfdcc0']];
function load(){let a=null;try{a=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!a){const n=Date.now();a=[
    {id:1,from:'him',t:n-3*36e5,c:'yellow',body:'（演示）他新贴的一张，还没看过，角上有个红点。'},
    {id:2,from:'me',t:n-1*D,c:'rose',body:'（演示）你贴的一张。',re:[{from:'him',t:n-20*36e5,body:'（演示）他在下面回了一句。'}]},
    {id:3,from:'him',t:n-2*D,c:'blue',seen:1,body:'（演示）便签可以长一点，也可以只有几个字。长的会多占几行，墙上是错落着排的。'},
    {id:4,from:'him',t:n-4*D,c:'cream',seen:1,body:'（演示）短的。'},
    {id:5,from:'me',t:n-6*D,c:'green',body:'（演示）更早的一张，你贴的。'},
    {id:6,from:'him',t:n-9*D,c:'yellow',seen:1,body:'（演示）再早一点的。'}];save(a)}return a}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
let L=load(),tab='all',cur=null,fresh=null;
const fd=t=>{const d=new Date(t),n=new Date(),days=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/D);return days===0?'今天':days===1?'昨天':days<7?days+' 天前':(d.getMonth()+1)+' 月 '+d.getDate()+' 日'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)};
const rnd=id=>{const x=Math.sin(id*12.9898)*43758.5453;return x-Math.floor(x)};
function draw(){const nn=L.filter(l=>l.from==='him'&&!l.seen).length;$('#nNew').textContent=nn||'';$('#nNew').style.display=nn?'':'none';try{parent.noteBadge&&parent.noteBadge(nn)}catch(e){}
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===tab);b.classList.toggle('dim',tab!=='all'&&b.dataset.t!==tab)});$('#allBtn').textContent=tab==='all'?'公告板':'看全部';
  const a=L.filter(l=>tab==='all'||l.from===tab).sort((x,y)=>y.t-x.t),B=$('#body');
  if(!a.length){B.innerHTML=`<div class="empty">${tab==='me'?'你还没挂过。<br>点下面的便签本挂一张。':'绳上是空的。'}</div>`;return}
  B.innerHTML=`<p class="sum">绳上 ${a.length} 张${nn&&tab!=='me'?' · '+nn+' 张没看过':''}</p><div class="wall" id="wall"></div>`;const W=$('#wall');
  let row=null;a.forEach((l,i)=>{if(i%2===0){row=document.createElement('div');row.className='line';W.appendChild(row)}
    const h=document.createElement('div');h.className='hang'+(l.id===fresh?' drop':'');h.dataset.id=l.id;const r=((rnd(l.id+3)-.5)*4).toFixed(1)+'deg';h.style.setProperty('--r',r);if(i%2)h.style.marginTop=(6+rnd(l.id+5)*16).toFixed(0)+'px';
    const b=document.createElement('button');b.type='button';b.className='n hand';b.dataset.c=l.c;b.style.setProperty('--r',r);b.style.setProperty('--d',(-rnd(l.id+7)*5).toFixed(1)+'s');b.style.setProperty('--s',(4+rnd(l.id+9)*1.6).toFixed(1)+'s');
