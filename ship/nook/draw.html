<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>皇冠与锚</title>
<style>
@font-face{font-family:"Letter";src:url(../../post/fonts/wenkai-core.woff2) format("woff2");font-display:swap}@font-face{font-family:"LetterAll";src:url(../../post/fonts/wenkai.woff2) format("woff2");font-display:swap}
:root{--bg:#cfa56c;--paper:#fdf7e6;--ink:#3a2a1a;--soft:rgba(58,42,26,.7);--line:rgba(58,42,26,.18);--red:#a8322a;--navy:#2b4660}
body[data-sky=night]{--bg:#3a2f2a;--paper:#3a3542;--ink:#efe3c8;--soft:rgba(239,227,200,.65);--line:rgba(239,227,200,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button,input{font-family:inherit;color:inherit}.hand{font-family:"Letter","LetterAll","Kaiti SC","STKaiti","KaiTi",serif}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;height:calc(44px + env(safe-area-inset-top)*.7);padding:calc(env(safe-area-inset-top)*.7) 10px 0;background:var(--navy);color:#fdf3d8;border-bottom:3px solid #b08a4a}
.bar button{border:0;background:rgba(253,243,216,.14);color:#fdf3d8;height:28px;padding:0 11px;border-radius:14px;font-size:12.5px;cursor:pointer}
.bar b{flex:1;text-align:center;font-weight:400;font-size:17px;margin-right:62px}
.body{flex:1;overflow-y:auto;padding:0 0 30px;-webkit-overflow-scrolling:touch;background-color:var(--bg);background-image:repeating-linear-gradient(90deg,rgba(255,235,190,.07) 0 2px,transparent 2px 9px,rgba(90,55,20,.06) 9px 10px,transparent 10px 23px),repeating-linear-gradient(180deg,rgba(80,48,16,.34) 0 1.5px,rgba(255,236,196,.2) 1.5px 3px,transparent 3px 76px);background-attachment:local}
.tabs2{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;border:1.5px solid rgba(58,42,26,.3);background:rgba(253,247,230,.5);border-radius:15px;height:30px;padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs2 button.on{background:var(--navy);border-color:var(--navy);color:#fdf3d8}
/* 帆布 */
.table{position:relative;margin:8px 10px 0}
.mat{position:relative;aspect-ratio:var(--mar,1.5);background:url(img/ca_mat.webp) center/100% 100% no-repeat;filter:drop-shadow(0 8px 9px rgba(50,28,8,.38))}
.cells{position:absolute;left:var(--gl,4%);right:var(--gr,4%);top:var(--gt,5%);bottom:var(--gb,5%);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.cell{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 5% 7%;cursor:pointer;border-radius:6px;transition:background .3s,box-shadow .3s,transform .3s}
.cell span{font-size:clamp(12px,3.7vw,17px);line-height:1.3;text-align:center;color:#3a2a1a;max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.empty span{color:rgba(58,42,26,0.88);font-size:12px}
.cell.hit{background:rgba(255,236,170,.5);box-shadow:0 0 0 2.5px #b08a4a,0 0 18px rgba(255,220,130,.8);transform:scale(1.03);z-index:2}
.cell.hit2{background:rgba(255,236,170,.28);box-shadow:0 0 0 2px rgba(176,138,74,.7)}
.editing .cell{box-shadow:inset 0 0 0 1.5px rgba(43,70,96,.55);background:rgba(255,255,255,.18)}
.dice{position:absolute;inset:0;pointer-events:none;z-index:5}
.die{position:absolute;left:0;top:0;width:var(--ds,54px);height:var(--ds,54px);background-image:url(img/ca_dice.webp);background-size:300% 200%;border-radius:18%;filter:drop-shadow(0 5px 4px rgba(40,22,6,.5));will-change:transform}
.rail{display:flex;align-items:center;gap:10px;margin:12px 14px 0}
.rail .say{flex:1;min-width:0;font-size:16px;line-height:1.45}
.rail .say small{display:block;font-size:12px;color:var(--soft);font-family:-apple-system,"PingFang SC",sans-serif;margin-top:1px}
.roll{flex:none;border:0;border-radius:22px;height:44px;padding:0 20px;font-size:16px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 3px 0 #6f1f1a,0 6px 10px rgba(50,28,8,.3);transition:transform .1s,box-shadow .1s}
.roll:active{transform:translateY(3px);box-shadow:0 0 0 #6f1f1a}
.roll[disabled]{opacity:.55}
.res{margin:12px 14px 0;background:var(--paper);border-radius:6px;padding:12px 14px;box-shadow:0 3px 8px rgba(50,28,8,.25);display:none}
.res.on{display:block;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.res b{display:block;font-weight:400;font-size:21px;line-height:1.45}
.res small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.res .ops{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.res .ops button{border:1.5px solid var(--line);background:transparent;border-radius:16px;height:32px;padding:0 13px;font-size:13px;cursor:pointer}
.res .ops button.pri{background:var(--navy);border-color:var(--navy);color:#fdf3d8}
.sec{margin:14px 14px 0;background:var(--paper);border-radius:6px;padding:12px 14px;box-shadow:0 3px 8px rgba(50,28,8,.25)}
.sec h3{margin:0 0 8px;font-weight:400;font-size:13px;color:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3 span:first-child{flex:1}
.sec h3 button{border:0;background:transparent;color:var(--navy);font-size:12.5px;padding:2px 0 2px 8px;cursor:pointer}
body[data-sky=night] .sec h3 button{color:#9fc0e0}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14.5px}
.row:first-child{border-top:0}
.row span{flex:1;min-width:0;word-break:break-all}
.row em{font-style:normal;font-size:12px;color:var(--soft);flex:none}
.row i{flex:none;width:20px;height:20px;background-image:url(img/ca_dice.webp);background-size:300% 200%;border-radius:4px}
.empty{font-size:15px;color:var(--soft);padding:8px 0;text-align:center}
.how{font-size:15px;line-height:1.75;color:var(--soft)}
.tip{font-size:12px;margin:8px 16px 0;text-align:center;color:rgba(58,42,26,0.88)}
body[data-sky=night] .tip{color:rgba(239,227,200,0.94)}
/* 小纸条：改字、起名 */
.ask{position:absolute;inset:0;z-index:30;background:rgba(30,20,10,.5);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.ask.on{opacity:1;pointer-events:auto}
.ask .sheet{width:100%;background:var(--paper);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1.1,.4,1)}
.ask.on .sheet{transform:none}
.ask h4{margin:0 0 10px;font-weight:400;font-size:15px}
.ask input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;background:transparent;padding:0 12px;font-size:16px;outline:0;-webkit-user-select:text;user-select:text}
.ask .ops{display:flex;gap:8px;margin-top:12px}
.ask .ops button{flex:1;height:40px;border-radius:20px;border:1.5px solid var(--line);background:transparent;font-size:14px;cursor:pointer}
.ask .ops button.pri{background:var(--navy);border-color:var(--navy);color:#fdf3d8}
.ask .ops button.del{flex:none;padding:0 14px;color:var(--red);border-color:rgba(168,50,42,.4)}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(30,20,10,.85);color:#fdf3d8;font-size:13px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1}

/* 顶上不要深蓝横栏：只留小返回钮，名字是一行手写字；卡片用旧纸，不用白底 */
.bar{background:none!important;border:0!important;color:#3a2a1a!important;height:calc(46px + env(safe-area-inset-top)*.7)!important}
.bar button{background:rgba(255,250,238,.92)!important;color:#3a2a1a!important;height:30px!important;border-radius:15px!important;box-shadow:0 1px 4px rgba(40,30,10,.3);font-weight:500}
.bar b{font-size:17px!important;color:#3a2a1a!important;text-shadow:0 1px 0 rgba(255,240,205,.5)}
:root{--paper:linear-gradient(rgba(250,242,222,.72),rgba(250,242,222,.72)),url(../../img/paper.webp) center/340px #efe0bb!important}
body[data-sky=night]{--paper:linear-gradient(rgba(58,53,66,.9),rgba(58,53,66,.9)),url(../../img/paper.webp) center/340px #3a3542!important}
body[data-sky=night] .bar b{color:#efe3c8!important;text-shadow:none}
</style></head><body>
<div id="app">
<div class="bar"><button id="back">‹ 回船上</button><b class="hand">皇冠与锚</b></div>
<div class="body" id="body">
  <div class="tabs2" id="mats"></div>
  <div class="table" id="table">
    <div class="mat" style="--mar:1.518;--gl:2.6%;--gr:2.8%;--gt:3.5%;--gb:4.5%"><div class="cells" id="cells"></div></div>
    <div class="dice" id="dice"></div>
  </div>
  <div class="rail"><div class="say hand" id="say"></div><button class="roll hand" id="roll">掷</button></div>
  <div class="res" id="res"><b class="hand" id="rt"></b><small id="rs"></small><div class="ops" id="rops"></div></div>
  <div class="sec">
    <h3><span id="mt"></span><button id="ren">这块布改名</button><button id="edit">改格子里的字</button></h3>
    <div class="how">水手的老玩法：一块帆布六个格子，三颗骰子。哪个图案掷出来的多，就听哪一格的。三颗都不一样，算老天没主意，再掷，或者自己从那三格里挑。</div>
  </div>
  <div class="sec">
    <h3><span>掷出来过的</span><button id="clr">清空</button></h3>
    <div id="log"></div>
  </div>
  <div class="tip">格子里的字都是演示，点「改格子里的字」换成你们自己的</div>
</div>
<div class="ask" id="ask"><div class="sheet"><h4 id="aq"></h4><input id="ai" maxlength="16"><div class="ops"><button class="del" id="adel">拿走</button><button id="ano">算了</button><button class="pri" id="aok">好</button></div></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
try{document.body.dataset.sky=parent.document.body.dataset.sky||''}catch(e){}
$('#back').onclick=()=>{try{parent.closeNook()}catch(e){history.back()}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SYM=['皇冠','船锚','红心','方块','梅花','黑桃'];           /* 格子和骰子面的顺序：第一行 皇冠 锚 心，第二行 方块 梅花 黑桃 */
const face=i=>`background-position:${(i%3)*50}% ${Math.floor(i/3)*100}%`;
let D=LS.get('draw-2',null);
if(!D){D={cur:0,log:[],mats:[
  {name:'今天一起做什么（演示）',c:['听一张完整的专辑','各写一封信','读同一本书','看一部老电影','就挂着电话','翻翻去年今天']},
  {name:'今晚吃什么（演示）',c:['面','粥','饺子','煮点热的','他来挑','吃剩的']},
  {name:'谁先说晚安（演示）',c:['你','他','你','他','一起数三二一','再聊五分钟']}]};LS.set('draw-2',D)}
const save=()=>LS.set('draw-2',D),M=()=>D.mats[D.cur]||D.mats[0];
let editing=false,busy=false;
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600)}
function ago(t){const m=Math.round((Date.now()-t)/6e4);return m<1?'刚刚':m<60?m+' 分钟前':m<1440?Math.round(m/60)+' 小时前':Math.round(m/1440)+' 天前'}
/* 页面里自己的小纸条，不用系统弹框 */
function ask(q,v,del){return new Promise(res=>{const a=$('#ask'),i=$('#ai');$('#aq').textContent=q;i.value=v||'';$('#adel').style.display=del?'':'none';a.classList.add('on');setTimeout(()=>i.focus(),250);
  const done=r=>{a.classList.remove('on');i.blur();res(r)};$('#aok').onclick=()=>done(i.value.trim());$('#ano').onclick=()=>done(null);$('#adel').onclick=()=>done(false);i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}

function paint(){
  $('#mats').innerHTML=D.mats.map((t,i)=>`<button data-i="${i}" class="${i===D.cur?'on':''}">${esc(t.name)}</button>`).join('')+'<button data-new="1">＋ 再铺一块</button>';
  const m=M();$('#cells').innerHTML=m.c.map((t,i)=>`<div class="cell ${t?'':'empty'}" data-i="${i}"><span class="hand">${t?esc(t):(editing?'点这里写':'空着')}</span></div>`).join('');
  $('#table').classList.toggle('editing',editing);$('#edit').textContent=editing?'改好了':'改格子里的字';$('#mt').textContent='「'+m.name+'」';
  $('#say').innerHTML=editing?'点哪一格，就改哪一格<small>改完点右下「改好了」</small>':'看老天的意思<small>点「掷」或点帆布</small>';
  $('#roll').disabled=editing;
  $('#log').innerHTML=D.log.length?D.log.slice(0,12).map(l=>`<div class="row">${l.d.map(x=>`<i style="${face(x)}"></i>`).join('')}<span class="hand">${esc(l.t)}</span><em>${ago(l.at)}</em></div>`).join(''):'<div class="empty">还没掷过</div>';$('#clr').style.display=D.log.length?'':'none'}

/* 掷骰子 */
const diceBox=$('#dice');let dice=[];
function mkDice(){diceBox.innerHTML='<div class="die"></div><div class="die"></div><div class="die"></div>';dice=[...diceBox.children];rest()}
function rest(){const W=diceBox.clientWidth,H=diceBox.clientHeight,s=Math.max(34,Math.min(60,W*.14));diceBox.style.setProperty('--ds',s+'px');
  dice.forEach((d,i)=>{d.style.cssText+=';'+face([0,1,2][i]);d.style.transform=`translate(${W-s*(3.55-i*.78)}px,${H+6}px) rotate(${[-8,5,-3][i]}deg) scale(.68)`})}
function roll(){if(busy||editing)return;busy=true;$('#res').classList.remove('on');document.querySelectorAll('.cell').forEach(c=>c.classList.remove('hit','hit2'));
  const W=diceBox.clientWidth,H=diceBox.clientHeight,s=parseFloat(getComputedStyle(diceBox).getPropertyValue('--ds'))||50,out=[0,0,0].map(()=>Math.floor(Math.random()*6));
  const T=1350,t0=performance.now(),ends=[];
  dice.forEach((d,i)=>{let ex,ey,ok=0,n=0;do{ex=W*(.14+Math.random()*.62);ey=H*(.2+Math.random()*.5);ok=ends.every(e=>Math.hypot(e[0]-ex,e[1]-ey)>s*1.25)}while(!ok&&++n<40);ends.push([ex,ey]);
    d._sx=W*.5+(i-1)*s*.6;d._sy=H+s;d._ex=ex;d._ey=ey;d._rot=(Math.random()<.5?-1:1)*(540+Math.random()*540);d._end=(Math.random()-.5)*50;d._delay=i*70});
  (function step(now){const k0=(now-t0);let all=true;
    dice.forEach((d,i)=>{const k=Math.max(0,Math.min(1,(k0-d._delay)/T));if(k<1)all=false;const e=1-Math.pow(1-k,3),hop=Math.abs(Math.sin(k*Math.PI*3))*(1-k)*s*.9;
      const x=d._sx+(d._ex-d._sx)*e,y=d._sy+(d._ey-d._sy)*e-hop,r=d._rot*(1-e)+d._end,sc=1+hop/s*.25;
      d.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`;
      if(k<.86){if(Math.floor(k*26)!==d._f){d._f=Math.floor(k*26);d.style.backgroundPosition=face(Math.floor(Math.random()*6)).split(':')[1]}}else d.style.backgroundPosition=face(out[i]).split(':')[1]});
    if(!all)requestAnimationFrame(step);else setTimeout(()=>settle(out),180)})(t0)}
function settle(out){const m=M(),cnt={};out.forEach(x=>cnt[x]=(cnt[x]||0)+1);const ks=Object.keys(cnt).map(Number),best=ks.sort((a,b)=>cnt[b]-cnt[a])[0],cells=[...document.querySelectorAll('.cell')];
  const res=$('#res'),ops=$('#rops');busy=false;
  if(cnt[best]>=2){cells[best].classList.add('hit');const t=m.c[best]||'（这格空着）';
    $('#rt').textContent=t;$('#rs').textContent=(cnt[best]===3?'三颗全是'+SYM[best]+'，没得商量':'两颗'+SYM[best])+' · 「'+m.name.replace('（演示）','')+'」';
    ops.innerHTML='<button id="o1">不算，再掷</button><button class="pri" id="o2">就它了</button>';$('#o1').onclick=roll;$('#o2').onclick=()=>keep(t,out)}
  else{ks.forEach(k=>cells[k].classList.add('hit2'));$('#rt').textContent='三颗各一样，老天没主意';$('#rs').textContent=out.map(x=>SYM[x]).join('、')+' · 再掷一次，或者自己从亮着的三格里挑';
    ops.innerHTML='<button class="pri" id="o1">再掷</button>'+out.map(x=>`<button data-k="${x}">${esc(m.c[x]||SYM[x])}</button>`).join('');$('#o1').onclick=roll;ops.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>keep(m.c[+b.dataset.k]||SYM[+b.dataset.k],out))}
  res.classList.add('on')}
function keep(t,out){D.log.unshift({t,d:out,at:Date.now()});D.log=D.log.slice(0,40);save();$('#res').classList.remove('on');paint();rest();toast('记下了')}
$('#roll').onclick=roll;
let lastShake=0;addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a)return;if(Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z)>32&&Date.now()-lastShake>2200){lastShake=Date.now();roll()}});

$('#cells').onclick=async e=>{const c=e.target.closest('.cell');if(!c)return;if(!editing){roll();return}
  const i=+c.dataset.i,m=M(),v=await ask(SYM[i]+'这一格写什么？',m.c[i]);if(v===null)return;m.c[i]=v||'';save();paint()};
$('#edit').onclick=()=>{editing=!editing;$('#res').classList.remove('on');paint();rest()};
$('#mats').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.new){const n=await ask('新铺的这块布叫什么？','');if(!n)return;D.mats.push({name:n,c:['','','','','','']});D.cur=D.mats.length-1;editing=true}
  else{D.cur=+b.dataset.i;editing=false}$('#res').classList.remove('on');save();paint();rest()};
$('#ren').onclick=async()=>{const m=M(),n=await ask('这块布叫什么？',m.name,D.mats.length>1);if(n===null)return;
  if(n===false){D.mats.splice(D.cur,1);D.cur=0;toast('收起来了')}else if(n)m.name=n;save();paint()};
$('#clr').onclick=()=>{D.log=[];save();paint()};
addEventListener('resize',rest);
const mi=new Image();mi.onload=()=>{paint();mkDice()};mi.onerror=()=>{paint();mkDice()};mi.src='img/ca_mat.webp';
</script></body></html>
